  <path d="M34.2 19.5L40 13M29.8 19.5L24 13" stroke="#9fd6e6" stroke-width="1.2" stroke-linecap="round" fill="none"/>
  <!-- stripes -->
  <path d="M28.6 38h6.4M28.9 42h6M29.4 46h5" stroke="#0b6e8a" stroke-width="1.3" stroke-linecap="round"/>
</svg>
