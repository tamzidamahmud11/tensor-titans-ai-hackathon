<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Dengue Protirodh mosquito logo">
  <rect width="64" height="64" rx="14" fill="#0b6e8a"/>
  <!-- wings -->
  <path d="M30 27C24 14 12 11 8 15c-3 4 6 14 20 14z" fill="#e8f3f7" fill-opacity=".9"/>
  <path d="M34 27c6-13 18-16 22-12 3 4-6 14-20 14z" fill="#e8f3f7" fill-opacity=".65"/>
  <!-- legs -->
  <g stroke="#9fd6e6" stroke-width="2" stroke-linecap="round" fill="none">
    <path d="M30 36L20 44L15 56"/><path d="M32 38L30 50L28 58"/><path d="M34 36L44 44L49 56"/>
  </g>
  <!-- abdomen, thorax, head -->
  <ellipse cx="32" cy="40" rx="4.2" ry="8.5" fill="#22d3a5" transform="rotate(8 32 40)"/>
  <ellipse cx="32" cy="29" rx="5.2" ry="5.4" fill="#fff"/>
  <circle cx="32" cy="21.5" r="3.6" fill="#fff"/>
  <!-- proboscis & antennae -->
